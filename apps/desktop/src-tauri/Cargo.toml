[package]
name = "tdj-desktop"
version = "0.1.0"
description = "TDJ for macOS and iPadOS (Tauri 2 shell around the TDJ server)"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
name = "tdj_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tdj"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
cookie_store = "0.22.0"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "http2", "charset", "gzip", "brotli"] }
reqwest_cookie_store = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSURL", "NSError", "NSArray"] }

[features]
default = []
# Developer ID (DMG) builds only: the Mac App Store and iPadOS builds never update themselves.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
