name: Release apps
# One linked release: one commit, one tag, one version (root package.json, scripts/release/version.mjs) for
# the macOS DMG (Developer ID, notarised) on a GitHub Release as TDJ-macOS.dmg + updater latest.json, the Mac App
# Store pkg and the iOS IPA (iPhone + iPad) to TestFlight, and the web app deployed from the same commit
# (deploy-aws.yml, `web` input; on by default for tags); App Review submission runs in the same
# run (secrets: repository secrets). macOS minutes are spent only here, only on v* tags or a manual run, in ONE job that runs the same
# script as a rented Mac (scripts/release/mac-build.sh). docs/RELEASING.md explains every step and the cost.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "dmg, mas, ios (comma list; ipad = ios)"
        type: string
        default: "dmg,mas,ios"
      channel:
        description: "testflight = upload only · appstore-review = also submit for review (after approval)"
        type: choice
        options: [testflight, appstore-review]
        default: testflight
      metadata:
        description: "Also upload store metadata + screenshots (after approval)"
        type: boolean
        default: false
      web:
        description: "Also deploy the web app from this commit (same version)"
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency: release-apps
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      # fail closed before any macOS minute: a release signs with THIS repository's own Apple account. The upstream
      # author's team and bundle ID are used only in the upstream repository; a fork must set its own.
      - name: Require this repository's own Apple credentials
        env:
          HAS_ASC: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_BUNDLE: ${{ vars.TDJ_APP_BUNDLE_ID != '' }}
          UPSTREAM: ${{ github.repository == 'ArioMoniri/TDJ' }}
        run: |
          missing=""
          [ "$HAS_ASC" = true ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID/KEY_ID/PRIVATE_KEY (secrets)"
          if [ "$UPSTREAM" != true ]; then
            [ "$HAS_TEAM" = true ] || missing="$missing APPLE_TEAM_ID (secret)"
            [ "$HAS_BUNDLE" = true ] || missing="$missing TDJ_APP_BUNDLE_ID (variable)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing on ${GITHUB_REPOSITORY}:${missing}. Set your own (docs/APPLE_SETUP.md); nothing is released."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one version for web + Mac + iOS: the root package.json; a v* tag must match it (fails otherwise)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release/version.mjs --check --tag "$GITHUB_REF"
          else
            node scripts/release/version.mjs --check
          fi
          v=$(node scripts/release/version.mjs)
          # one version, one commit: a published v$v from another commit stops here, before any macOS minute
          # (a draft is fine: mac-build.sh re-points it at this commit)
          if [ "$(gh release view "v$v" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            t=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$v" --jq .sha)
            [ "$t" = "$GITHUB_SHA" ] || { echo "::error::v$v is already published from $t (this run: $GITHUB_SHA); pnpm release:version <next>"; exit 1; }
          fi
          # same formula as mac-build.sh: UTC minutes since 2026-01-01, monotonic, one number for every platform
          b=$(( ($(date -u +%s) - 1767225600) / 60 ))
          c="${GITHUB_SHA::12}"
          { echo "version=$v"; echo "build=$b"; echo "commit=$c"; } >> "$GITHUB_OUTPUT"
          echo "T-DJ $v (build $b, commit $c): web, iPhone, iPad and Mac" >> "$GITHUB_STEP_SUMMARY"

  apple:
    needs: version
    runs-on: ${{ vars.TDJ_MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    env:
      TDJ_DRIVE: ${{ github.workspace }}/.release/drive
      TDJ_OUT: ${{ github.workspace }}/.release/out
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      RUSTUP_HOME: /Users/runner/.rustup
      CARGO_HOME: /Users/runner/.cargo
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      # the upstream author's public team / bundle IDs only in the upstream repository (the version job checks a fork)
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || (github.repository == 'ArioMoniri/TDJ' && 'FF68N39FU5' || '') }}
      TDJ_APP_BUNDLE_ID: ${{ vars.TDJ_APP_BUNDLE_ID || (github.repository == 'ArioMoniri/TDJ' && 'com.ariomoniri.tdj' || '') }}
      # the App Store app's Apple ID for altool (it cannot always find it from the bundle ID)
      APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
      # the apps are standalone: no server address is built in; the Spotify Client ID is public (PKCE)
      TDJ_SPOTIFY_CLIENT_ID: ${{ vars.TDJ_SPOTIFY_CLIENT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # no package-manager cache here: mac-build.sh keeps its own pnpm store under TDJ_DRIVE, so setup-node's post
      # step found no store to save and failed the job after a successful build (run 43772268596)
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      # every target mac-build.sh and `tauri ios init` add, so neither installs one mid-build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - name: AWS (signing store in SSM)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Build, sign, notarise, upload (scripts/release/mac-build.sh)
        env:
          # fallback when SSM is not set up: the environment secrets of APPLE_SETUP.md
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          MAC_APPSTORE_PROFILE: ${{ secrets.MAC_APPSTORE_PROFILE }}
          SIGNING: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && 'ssm' || 'env' }}
          TARGETS: ${{ inputs.targets || 'dmg,mas,ios' }}
        run: |
          scripts/release/mac-build.sh --signing "$SIGNING" --targets "$TARGETS" \
            --version "${{ needs.version.outputs.version }}" --build "${{ needs.version.outputs.build }}" --github-release
      - name: Certificate and profile expiry (warn 30 days ahead)
        if: always()
        run: |
          for f in "$TDJ_DRIVE"/tdj-signing/*.keychain-db; do [ -f "$f" ] || continue
            security find-certificate -a -p "$f" | awk '/BEGIN/{n++} {print > ("/tmp/c" n ".pem")}'
          done
          for c in /tmp/c*.pem; do [ -f "$c" ] || continue
            end=$(openssl x509 -enddate -noout -in "$c" | cut -d= -f2); subj=$(openssl x509 -subject -noout -in "$c" | sed 's/.*CN *= *//')
            if ! openssl x509 -checkend $((30*86400)) -noout -in "$c" >/dev/null; then echo "::warning::$subj expires $end"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-builds
          path: ${{ github.workspace }}/.release/out
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove the signing keychain and API key from the runner
        if: always()
        run: |
          security delete-keychain "$TDJ_DRIVE/tdj-signing/tdj.keychain-db" 2>/dev/null || true
          rm -rf "$TDJ_DRIVE/tdj-signing" "$HOME/.appstoreconnect/private_keys"

  publish:
    needs: [version, apple]
    if: contains(inputs.targets || 'dmg', 'dmg')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      # what the installed DMG will fetch: latest.json, the tarball and its .sig as uploaded to the draft, checked
      # against the public key the app was built with, before the release becomes "latest"
      - name: Verify the auto-update assets on the draft release
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          d="$RUNNER_TEMP/release"; rm -rf "$d"; mkdir -p "$d"
          gh release download "v$V" -R "$GITHUB_REPOSITORY" -D "$d" \
            -p latest.json -p TDJ-macOS.app.tar.gz -p TDJ-macOS.app.tar.gz.sig -p SHA256SUMS -p T-DJ-macOS.dmg -p "T-DJ-$V-macOS.dmg" -p TDJ-macOS.dmg
          (cd "$d" && sha256sum -c SHA256SUMS)
          node scripts/release/verify-updater.mjs --manifest "$d/latest.json" --tarball "$d/TDJ-macOS.app.tar.gz" \
            --sig "$d/TDJ-macOS.app.tar.gz.sig" --version "$V" --repo "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the draft release
        run: |
          gh release edit "v$V" -R "$GITHUB_REPOSITORY" --draft=false --latest
          {
            echo "## Released T-DJ $V (commit ${{ needs.version.outputs.commit }})"
            echo "- Download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/T-DJ-macOS.dmg"
            echo "- TestFlight: build ${{ needs.version.outputs.build }} (iPhone, iPad and Mac), processing takes 5–30 min"
            echo "- Web: deployed from the same commit when the web job ran; /api/version reports $V"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    # the web app from the same commit, so web and apps report one version (deploy-aws.yml checks /api/version)
    needs: [version, apple]
    if: inputs.web || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-aws.yml
    with:
      commit: ${{ github.sha }}
      expect_version: ${{ needs.version.outputs.version }}
    secrets: inherit

  metadata:
    needs: apple
    if: inputs.metadata || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/store-assets.yml
    with: { upload: true }
    secrets: inherit

  submit-review:
    needs: [version, apple]
    if: inputs.channel == 'appstore-review'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      # the uploads need 5-30 min of App Store Connect processing before deliver can pick the build
      - name: Wait for App Store Connect to process build ${{ needs.version.outputs.build }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
          BUILD: ${{ needs.version.outputs.build }}
          PLATFORMS: ${{ contains(inputs.targets, 'mas') && 'IOS,MAC_OS' || 'IOS' }}
        run: node scripts/release/wait-build.mjs --build "$BUILD" --platforms "$PLATFORMS"
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/desktop }
      - name: Submit iOS (iPhone + iPad) and Mac for App Review (phased, manual release)
        working-directory: apps/desktop
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TDJ_APP_BUNDLE_ID: ${{ vars.TDJ_APP_BUNDLE_ID || (github.repository == 'ArioMoniri/TDJ' && 'com.ariomoniri.tdj' || '') }}
          BUILD: ${{ needs.version.outputs.build }}
          V: ${{ needs.version.outputs.version }}
          MAS: ${{ contains(inputs.targets, 'mas') }}
        run: |
          bundle exec fastlane ios submit build_number:"$BUILD" app_version:"$V"
          if [ "$MAS" = true ]; then bundle exec fastlane mac submit build_number:"$BUILD" app_version:"$V"; fi
