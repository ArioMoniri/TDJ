name: Store assets
# App Store screenshots (bundled app UI: iPhone 6.9" + 6.5", iPad 13" + 12.9", Mac 2880x1800; en-US + tr), banners,
# metadata checks and a contact sheet for review: Linux only, no macOS minutes. Same as `pnpm store:shots`. Uploading
# to App Store Connect (fastlane deliver with the API key) runs only when the upload input is set (repository secrets).
on:
  pull_request:
    paths: ["apps/desktop/fastlane/**", "apps/desktop/store/**", "apps/desktop/ui/**", "apps/web/src/**"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload metadata + screenshots to App Store Connect (after approval)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      upload: { type: boolean, default: false }
permissions:
  contents: read
concurrency: store-assets-${{ github.ref }}
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Metadata limits and pipeline tests
        run: pnpm --filter @tdj/desktop test
      - name: Bundled UI (static export of apps/web)
        run: pnpm --filter @tdj/desktop ui
      - name: Browser
        run: pnpm --filter @tdj/desktop exec playwright install --with-deps chromium
      - name: Standalone check (the bundle with the native side mocked; no request may leave the runner)
        env:
          CHROMIUM: ""
        run: pnpm --filter @tdj/desktop standalone
      - name: Capture, compose, contact sheet
        env:
          CHROMIUM: ""
        run: pnpm --filter @tdj/desktop run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: store-assets
          path: |
            apps/desktop/fastlane/screenshots
            apps/desktop/fastlane/screenshots_mac
            apps/desktop/fastlane/screenshots_ipad129
            apps/desktop/store/out/contact-sheet.html
          retention-days: 30
      - name: Summary
        run: |
          {
            echo "## Store assets"
            echo "Download the **store-assets** artifact and open \`store/out/contact-sheet.html\` (keep the folder layout)."
            find apps/desktop/fastlane/screenshots apps/desktop/fastlane/screenshots_mac apps/desktop/fastlane/screenshots_ipad129 -name '*.jpg' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: assets
    if: inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: store-assets, path: apps/desktop }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/desktop }
      - name: fastlane deliver (iPhone + iPad, then Mac) — metadata and screenshots, no binary
        working-directory: apps/desktop
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TDJ_APP_BUNDLE_ID: ${{ vars.TDJ_APP_BUNDLE_ID || 'com.ariomoniri.tdj' }}
        run: |
          bundle exec fastlane ios metadata
          bundle exec fastlane mac metadata
