name: Deploy to AWS
# One-click deploy: Actions → "Deploy to AWS" → Run workflow. Uses GitHub OIDC (no long-lived AWS keys).
# One-time setup: docs/DEPLOY.md (creates the IAM role with infra/github-oidc-role.yaml and sets AWS_DEPLOY_ROLE_ARN).
on:
  workflow_dispatch:
    inputs:
      stage: { description: "SST stage", default: "production", required: true }
      commit: { description: "Commit SHA to deploy (default: branch head)", default: "", required: false }
  push:
    branches: [main]
  # release-apps.yml deploys the web from the release commit, so web and apps share one version
  workflow_call:
    inputs:
      stage: { type: string, default: production }
      commit: { type: string, default: "" }
      expect_version: { type: string, default: "" }
permissions:
  id-token: write
  contents: read
concurrency: deploy-${{ github.ref }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'production' }}
    steps:
      # fail closed: a fork deploys only into its own AWS account, through the role its owner created
      # (tdj init --github / infra/github-oidc-role.yaml). Nothing here falls back to the upstream author's account.
      - name: Require this repository's own deploy role
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::No AWS_DEPLOY_ROLE_ARN on ${GITHUB_REPOSITORY}. Create your own deploy role first: pnpm tdj init --github (docs/SELF_DEPLOY.md, way C)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.commit || github.ref }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # a repository variable (tdj init --github sets it); a fork may keep it as a secret instead
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy with SST
        run: npx sst deploy --stage ${{ inputs.stage || 'production' }}
        env:
          # Settings -> About and /api/version report this commit (the root package.json has the version)
          TDJ_COMMIT: ${{ inputs.commit || github.sha }}
          TDJ_DOMAIN: ${{ vars.TDJ_DOMAIN }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          # Connectors (docs/DEPLOY.md → Connectors). Empty secrets are skipped by sst.config.ts; never echoed.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TDJ_COOKIE_SECRET: ${{ secrets.TDJ_COOKIE_SECRET }}
          TDJ_SECRET: ${{ secrets.TDJ_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPEDREAM_PROJECT_ID: ${{ secrets.PIPEDREAM_PROJECT_ID }}
          PIPEDREAM_CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
          PIPEDREAM_CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
          PIPEDREAM_ENVIRONMENT: ${{ vars.PIPEDREAM_ENVIRONMENT }}
      - name: Print URL
        run: cat .sst/outputs.json 2>/dev/null || true
      - name: Version check (/api/version)
        env:
          EXPECT: ${{ inputs.expect_version }}
        run: |
          URL=$(node -e 'try{process.stdout.write(require("./.sst/outputs.json").url||"")}catch(e){}')
          [ -n "$URL" ] || { echo "no URL in .sst/outputs.json"; exit 0; }
          WANT="${EXPECT:-$(node scripts/release/version.mjs)}"
          GOT=$(curl -fsS --retry 5 --retry-delay 10 "$URL/api/version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version||""))') || GOT=""
          echo "web reports version ${GOT:-?} (expected $WANT)" >> "$GITHUB_STEP_SUMMARY"
          [ "$GOT" = "$WANT" ] || echo "::warning::the web reports ${GOT:-nothing}, expected $WANT"
      # Owner setup (docs/DEPLOY.md → Connectors → Owner setup): a one-time code the owner pastes at /admin to
      # unlock the in-app configuration. It lives in SSM as a SecureString, expires after a day, and is deleted the
      # moment a passphrase is chosen. Once a passphrase exists no new code is issued (the summary says so).
      - name: Owner setup code
        env:
          STAGE: ${{ inputs.stage || 'production' }}
        run: |
          set -euo pipefail
          URL=$(node -e 'try{process.stdout.write(require("./.sst/outputs.json").url||"")}catch(e){}')
          if aws ssm get-parameter --name "/tdj/${STAGE}/OWNER_PASSPHRASE_HASH" --with-decryption --query Parameter.Name --output text >/dev/null 2>&1; then
            {
              echo "## Owner setup"
              echo "An owner passphrase is already set for stage \`${STAGE}\`: open \`${URL:-<app url>}/admin\` and unlock with it."
              echo "Lost it? Delete the parameter \`/tdj/${STAGE}/OWNER_PASSPHRASE_HASH\` in Systems Manager → Parameter Store and run this workflow again for a fresh setup code."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # reuse an unexpired, unused code so every deploy summary shows the same one (a new code only after 24 h)
          EXISTING=$(aws ssm get-parameter --name "/tdj/${STAGE}/SETUP_CODE" --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          CODE=""
          if [ -n "${EXISTING}" ] && [ "${EXISTING}" != "None" ]; then
            ISSUED=${EXISTING##*.}
            if [ "$(( $(date +%s) - ISSUED ))" -lt 86400 ]; then CODE=${EXISTING%.*}; fi
          fi
          if [ -z "${CODE}" ]; then
            CODE=$(openssl rand -hex 16)
            aws ssm put-parameter --name "/tdj/${STAGE}/SETUP_CODE" --type SecureString --overwrite \
              --value "${CODE}.$(date +%s)" >/dev/null
          fi
          # not masked: GitHub applies masks to the step summary too, which turned the code into asterisks
          {
            echo "## Owner setup"
            echo "1. Open **${URL:-<app url>}/admin**."
            echo "2. Paste this one-time setup code (valid for 24 hours, deleted once you choose a passphrase):"
            echo
            echo '```'
            echo "${CODE}"
            echo '```'
            echo
            echo "3. Choose a passphrase, then paste the Spotify / Google / Dropbox credentials next to the redirect URIs shown there."
            echo
            echo "Anyone who can read this summary (repository collaborators) can read the code until a passphrase is set: do it now."
          } >> "$GITHUB_STEP_SUMMARY"
