name: Check secrets
# Prints ONLY whether each expected secret / variable name is set (true/false). Never a value, never a length.
# Runs when this file changes on the apps branch, or from Actions → "Check secrets" → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [claude/admiring-curie-npzd0m]
    paths: [.github/workflows/check-secrets.yml]
permissions:
  contents: read
  id-token: write
jobs:
  repository:
    name: Repository secrets and variables
    runs-on: ubuntu-latest
    steps:
      - name: Presence (true/false)
        env:
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          S_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          S_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          S_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          S_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID != '' }}
          S_SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET != '' }}
          S_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID != '' }}
          S_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}
          S_DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY != '' }}
          S_DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET != '' }}
          S_TDJ_COOKIE_SECRET: ${{ secrets.TDJ_COOKIE_SECRET != '' }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          V_TDJ_APP_BUNDLE_ID: ${{ vars.TDJ_APP_BUNDLE_ID != '' }}
          V_TDJ_APP_BACKEND_URL: ${{ vars.TDJ_APP_BACKEND_URL != '' }}
          V_APPLE_APP_ID: ${{ vars.APPLE_APP_ID != '' }}
          V_TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
          V_AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
          V_AWS_REGION: ${{ vars.AWS_REGION != '' }}
          V_NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL != '' }}
        run: |
          {
            echo "## Repository secrets and variables (set = true)"
            echo "| Name | Kind | Set |"
            echo "|---|---|---|"
            env | grep -E '^(S|V)_' | sort | while IFS='=' read -r k v; do
              kind=secret; [ "${k%%_*}" = V ] && kind=variable
              echo "| ${k#?_} | $kind | $v |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  apple-release:
    name: Apple signing secrets
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Presence (true/false)
        env:
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          S_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          S_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          S_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
          S_APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 != '' }}
          S_APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD != '' }}
          S_MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 != '' }}
          S_MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD != '' }}
          S_DEVELOPER_ID_APPLICATION_CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 != '' }}
          S_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD != '' }}
          S_IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE != '' }}
          S_MAC_APPSTORE_PROFILE: ${{ secrets.MAC_APPSTORE_PROFILE != '' }}
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          {
            echo "## Repository secrets"
            echo "| Name | Set |"
            echo "|---|---|"
            env | grep -E '^S_' | sort | while IFS='=' read -r k v; do echo "| ${k#S_} | $v |"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ssm:
    name: Signing store in AWS SSM (names only)
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    continue-on-error: true
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Which /tdj/apple parameters exist (no values are read)
        run: |
          names="APPLE_DISTRIBUTION_CERT_P12 APPLE_DISTRIBUTION_CERT_PASSWORD MAC_INSTALLER_CERT_P12 MAC_INSTALLER_CERT_PASSWORD DEVELOPER_ID_APPLICATION_CERT_P12 DEVELOPER_ID_APPLICATION_CERT_PASSWORD IOS_APPSTORE_PROFILE MAC_APPSTORE_PROFILE"
          existing=$(aws ssm describe-parameters --parameter-filters "Key=Path,Option=Recursive,Values=/tdj/apple" --query 'Parameters[].Name' --output text || true)
          {
            echo "## AWS SSM /tdj/apple"
            echo "| Name | Set |"
            echo "|---|---|"
            for n in $names; do
              if echo "$existing" | tr '\t' '\n' | grep -qx "/tdj/apple/$n"; then echo "| $n | true |"; else echo "| $n | false |"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
