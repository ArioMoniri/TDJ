name: CI
on:
  push: { branches: ["**"] }
  pull_request:

# a newer push to the same branch supersedes the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the fast checks, beside the build
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm readme:check
      - run: pnpm typecheck
      - run: pnpm quality

  # the engine's invariants (58 files, ~1,000 tests of whole composed nights: over 20 min on one runner) in three
  # shards of whole files, each file beside the others on the runner's cores (packages/core/vitest.config.ts)
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Core tests (shard ${{ matrix.shard }} of 3)
        run: pnpm --filter @tdj/core test --shard=${{ matrix.shard }}/3

  # one production build, reused by every e2e shard
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tdj/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          # .next is a hidden folder: upload-artifact skips those unless asked; the build cache is not needed to start
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 1

  # the Playwright suite (1.9 h on one runner) in six shards of one worker each against `next start` on the build
  # above; a failed test is retried once on CI (playwright.config.ts) and every shard uploads its report
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: web-build, path: apps/web/.next }
      - name: Playwright's Chromium (cached per lockfile)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
        working-directory: apps/web
      - name: Playwright e2e (shard ${{ matrix.shard }} of 6)
        working-directory: apps/web
        # a shared 4-core runner renders slower than a real device: frames are held to 30 fps here, 60 fps locally
        env:
          TDJ_FRAME_BUDGET: "34"
        run: CHROMIUM= pnpm exec playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
