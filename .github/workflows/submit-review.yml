name: Submit for App Review
# Submits builds Release apps already uploaded (no rebuild): waits for App Store Connect to process the build, then
# submits iOS (iPhone + iPad) and, when asked, the Mac App Store build. Phased, manual release after approval.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (CFBundleVersion) of the uploaded builds, e.g. 462004"
        required: true
      version:
        description: "Marketing version, e.g. 1.0.0"
        required: true
      mac:
        description: "Also submit the Mac App Store build"
        type: boolean
        default: true
permissions:
  contents: read
concurrency: submit-review
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Require this repository's own App Store Connect key
        env:
          HAS_ASC: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_ASC" != true ]; then
            echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID/KEY_ID/PRIVATE_KEY on ${GITHUB_REPOSITORY}; nothing is submitted."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - name: Wait for App Store Connect to process build ${{ inputs.build }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
          BUILD: ${{ inputs.build }}
          PLATFORMS: ${{ inputs.mac && 'IOS,MAC_OS' || 'IOS' }}
        run: node scripts/release/wait-build.mjs --build "$BUILD" --platforms "$PLATFORMS"
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/desktop }
      - name: Submit for App Review
        working-directory: apps/desktop
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TDJ_APP_BUNDLE_ID: ${{ vars.TDJ_APP_BUNDLE_ID || (github.repository == 'ArioMoniri/TDJ' && 'com.ariomoniri.tdj' || '') }}
          BUILD: ${{ inputs.build }}
          V: ${{ inputs.version }}
          MAC: ${{ inputs.mac }}
        run: |
          bundle exec fastlane ios submit build_number:"$BUILD" app_version:"$V"
          if [ "$MAC" = true ]; then bundle exec fastlane mac submit build_number:"$BUILD" app_version:"$V"; fi
